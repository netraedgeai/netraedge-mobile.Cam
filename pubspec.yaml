name: netraedge_mobile
description: NetraEdge Pro NVR Mobile Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_vlc_player: ^7.4.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: "logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - logo.png
    
